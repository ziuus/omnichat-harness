version: '3.8'

services:
  # Redis — required for BullMQ task queue
  redis:
    image: redis:7-alpine
    container_name: omni-redis
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # OmniChat server (optional — can run with `bun run dev:server` instead)
  # server:
  #   build:
  #     context: .
  #     dockerfile: docker/Dockerfile.server
  #   container_name: omni-server
  #   ports:
  #     - '3000:3000'
  #   environment:
  #     - NODE_ENV=production
  #     - REDIS_URL=redis://redis:6379
  #     - DATABASE_URL=/data/omnichat.db
  #     - SESSION_STORAGE_PATH=/data/sessions
  #   volumes:
  #     - omni-data:/data
  #   depends_on:
  #     redis:
  #       condition: service_healthy
  #   restart: unless-stopped

volumes:
  redis-data:
  omni-data:
